name: build

on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - develop
      - master

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    env:
      TZ: Europe/London
    steps:
      - name: Checkout repository
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          # Disabling shallow clone is recommended for improving relevancy of reporting
          fetch-depth: 0
      - name: Install node
        uses: actions/setup-node@6a61c0375d66246de94630495909f12cf8dac84d
        with:
          node-version: '22.x'
      - name: Install NPM
        run: npm install -g npm@11.5.1
      - name: Install dependencies
        run: npm ci --workspaces --include=dev --include-workspace-root
      - name: Shai-hulud scan
        uses: gensecaihq/Shai-Hulud-2.0-Detector@50ede91dd311e86216cd11d75acfbf7232ef1416
        with:
          working-directory: '.'
          scan-lockfiles: true
      - name: Run tests
        run: npm run test
      - name: Fix code coverage paths
        working-directory: ./coverage
        run: |
          sed -i 's/\/home\/runner\/work\/rod-licensing\/rod-licensing\//\/github\/workspace\//g' lcov.info
      - name: SonarCloud Scan
        uses: sonarsource/sonarqube-scan-action@45f27363d4ff7d6b16baa0516490f10c52bdd5fc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  new-version:
    name: new-version
    runs-on: ubuntu-latest
    needs: tests
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
      - name: Install node
        uses: actions/setup-node@6a61c0375d66246de94630495909f12cf8dac84d
        with:
          node-version: '22.x'
      - name: Install NPM
        run: npm install -g npm@11.5.1
      - name: Install dependencies
        run: npm ci --workspaces --include-workspace-root
      - name: Extract branch name
        shell: bash
        run: echo "branch=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_OUTPUT
        id: extract_branch
      - name: Run versioning script
        run: . ./scripts/github/deploy.sh
        env:
          GITHUB_AUTH: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          BRANCH: ${{ steps.extract_branch.outputs.branch }}
          HUSKY: 0
